name: Windows ARM64 Bootstrap Preflight

on:
  push:
    branches:
      - exp/win-arm64-bootstrap
  pull_request:
    paths:
      - "**/*.py"
      - "requirements-win-arm64.txt"
      - "requirements-win-arm64-native.txt"
      - "scripts/bootstrap-win-arm64.ps1"
      - ".github/workflows/win-arm64-bootstrap-preflight.yml"

jobs:
  python-syntax:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile Python sources
        run: python -m compileall -q UVR.py separate.py demucs lib_v5 gui_data scripts

  powershell-syntax:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse bootstrap script
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "scripts/bootstrap-win-arm64.ps1"),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -ne 0) {
            $errors | Format-List | Out-String | Write-Error
            exit 1
          }

  package-availability:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validate package pins exist
        run: |
          python -m pip install --upgrade pip
          python -m pip download --dest packagehouse --no-deps -r requirements-win-arm64.txt

  arm64-wheel-resolution:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - python-version: "3.12"
            abi: cp312
          - python-version: "3.13"
            abi: cp313
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Resolve Windows ARM64 native wheels
        run: |
          python -m pip install --upgrade pip
          python -m pip download \
            --dest wheelhouse \
            --only-binary=:all: \
            --platform win_arm64 \
            --python-version ${{ matrix.python-version }} \
            --implementation cp \
            --abi ${{ matrix.abi }} \
            -r requirements-win-arm64-native.txt

  pytorch-arm64-wheel:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - python-version: "3.12"
            abi: cp312
          - python-version: "3.13"
            abi: cp313
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Resolve PyTorch Windows ARM64 wheel
        run: |
          python -m pip install --upgrade pip
          python -m pip download \
            --dest torch-wheelhouse \
            --no-deps \
            --only-binary=:all: \
            --platform win_arm64 \
            --python-version ${{ matrix.python-version }} \
            --implementation cp \
            --abi ${{ matrix.abi }} \
            --index-url https://download.pytorch.org/whl/cpu \
            "torch==2.14.0+cpu"
